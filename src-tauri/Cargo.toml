[package]
name = "productivitree-desktop"
version = "0.1.0"
description = "Productivitree para Mac: tus proyectos como un árbol vivo"
authors = ["Jose Sanz"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name.
name = "productivitree_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
